[project]
name = "hippocrates-analytics"
version = "2.0.0"
description = "Rule-based pre-screening of patients against oncology clinical trials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "tableauhyperapi>=0.0.20000"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hippocrates = "hippocrates.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hippocrates"]

[tool.setuptools.package-data]
hippocrates = ["dashboard_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]